<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>McBerto hors connexion</title>
        <style>
            body {
                margin: 0;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f3f4f6;
                color: #111827;
                display: grid;
                min-height: 100vh;
                place-items: center;
            }
            main {
                width: min(28rem, calc(100vw - 2rem));
                background: white;
                border: 1px solid #e5e7eb;
                border-radius: .5rem;
                padding: 1.5rem;
                box-shadow: 0 1px 2px rgb(0 0 0 / .06);
            }
            h1 {
                font-size: 1.25rem;
                margin: 0 0 .5rem;
            }
            p {
                color: #4b5563;
                line-height: 1.5;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Connexion indisponible</h1>
            <p>Ouvrez la caisse déjà chargée pour continuer les ventes hors connexion. Les ventes seront synchronisées au retour du réseau.</p>
        </main>
    </body>
</html>
